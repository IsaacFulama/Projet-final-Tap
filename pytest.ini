[pytest]
# Configuration de pytest pour l'application TAP Gestion des Loyers

# Répertoires de tests
testpaths = tests

# Patterns de fichiers à inclure/exclure
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options de sortie
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=tap.core.auth
    --cov=tap.core.date_utils
    --cov=tap.core.validators
    --cov=tap.infrastructure.database
    --cov-report=html
    --cov-report=term-missing
    # Le périmètre couvre le cœur métier et l'accès aux données; l'UI est validée
    # séparément par compilation et génération de l'exécutable.
    --cov-fail-under=50

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents
    database: Tests nécessitant une base de données

# Couverture
[coverage:run]
source = tap
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
